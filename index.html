<style>

.th{background:#202c33;align-self:flex-start}
.me{background:#005c4b;align-self:flex-end}

.dots i.on{background:#fff}
.sh{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

.keys button{height:64px;border-radius:50%;border:0;background:#ffffff2a;color:#fff;font-size:24px;cursor:pointer}

.hs button{padding:9px 13px;border-radius:10px;border:0;background:#7c3aed;color:#fff;font:inherit;cursor:pointer}
.ch{padding:9px 12px;border-radius:10px;background:#16232b;margin-bottom:6px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #d946ef;outline-offset:2px}
.chs{display:flex;flex-direction:column;gap:6px;padding:8px 12px 24px;background:#0b141a}.chs button{padding:10px;border-radius:12px;border:1px solid #25d366;background:none;color:#e9edef;font:inherit;cursor:pointer}
.tb{display:flex;background:#111b21}.tb button{flex:1;padding:9px;background:none;border:0;border-bottom:2px solid transparent;color:#e9edef;font:inherit;cursor:pointer}.tb .on{border-color:#25d366}.row2 button{border:0;border-radius:30px;padding:12px 20px;color:#fff;font:inherit;cursor:pointer}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}.pt{aspect-ratio:1;background:#16232b;display:grid;place-items:center;font-size:40px;overflow:hidden;cursor:pointer}.pt img{width:100%;height:100%;object-fit:cover}
.call{position:absolute;inset:0;z-index:6;background:#111c;backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}.row2{display:flex;gap:40px}.call button{border:0;border-radius:30px;padding:14px 22px;color:#fff;font:inherit;cursor:pointer}.rj{background:#ef4444}.ac{background:#22c55e}
.nch{position:absolute;top:0;left:50%;width:170px;height:30px;margin-left:-85px;background:#000;border-radius:0 0 20px 20px;z-index:3}
#scr:not([data-m=lock]):not([data-m=home]) .sb{background:#111b21}#scr[data-m=wa] .sb{background:#075e54}#scr[data-m=lock] .sb,#scr[data-m=home] .sb{background:none}
.hm{padding-top:20px}.hm .gr{gap:18px 4px;margin-top:22px}.ap{font-weight:600;font-size:12px;text-shadow:0 1px 3px #0008;gap:6px}
.ap .ic{position:relative;width:68px;height:68px;border-radius:20px;background:#ffffff26;border:2px solid #ffffff55;display:grid;place-items:center;font-size:32px}
.ic img{width:100%;height:100%;object-fit:contain;border-radius:inherit}.ap .ic .bd{position:absolute;top:-7px;right:-7px}
.dock{margin-top:auto;width:100%;background:#3a3b3fcc;border-radius:34px;padding:14px 8px;display:flex;justify-content:space-around;margin-bottom:26px}.dock .ic{width:60px;height:60px;border:0;background:#ffffff14}
.wa{display:flex;flex-direction:column;flex:1;min-height:0;background:#fff;color:#111}.wa .hd{background:#075e54;color:#fff}.wa .hd button{color:#fff}.wa .hd small{color:#b7f5d0}
.wa .lst{background:#fff;color:#111}.wa .it{border-bottom:1px solid #eee}.wa .it small{color:#6b7280}.wa .av{background:#e5e7eb}.wa .bd{background:#25d366}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}.rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.sr{margin:10px 14px;padding:10px 14px;border-radius:14px;background:#f1f2f4;color:#9ca3af}.sec{padding:10px 16px;background:#f6f7f9;color:#6b7280;font-weight:700;font-size:12px}
.me0{display:flex;flex-direction:column;align-items:center;gap:4px;padding:20px}.big0{width:110px;height:110px;font-size:56px;border:4px solid #25d366}
.fl{padding:14px 18px;border-bottom:1px solid #eee}.fl small{display:block;color:#075e54;font-weight:700;margin-bottom:4px}
.wa .msgs{background:#ece5dd;color:#111}.wa .th{background:#fff}.wa .me{background:#dcf8c6}.wa .me small{color:#128c7e}
.wa .chs{background:#ece5dd}.wa .chs button{color:#111;background:#fff}
.inp{display:flex;align-items:center;gap:8px;padding:8px 10px 26px;background:#f0f0f0}.cm,.mic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#d1d5db}.mic{background:#25d366}.tx{flex:1;background:#fff;border-radius:22px;padding:11px 16px;color:#9ca3af}
.tab{display:flex;border-top:1px solid #eee;background:#fff;padding:6px 0 22px}.tab button{flex:1;background:none;border:0;font:inherit;font-size:12px;font-weight:600;color:#9ca3af;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}.tab .on{color:#075e54}.tab b{font-size:22px}
.wa .pad{background:#f8f9fb;color:#111}.wa .dots i{border-color:#9ca3af}.wa .dots i.on{background:#374151}.wa .keys button{background:#e5e7eb;color:#111}.wa .lnk{color:#111}
@media (max-width:480px){#ph{width:100%;height:100%;max-height:none;border:0;border-radius:0}.cap{display:none}}
</style></head><body>
<div id="ph"><div id="scr"></div></div>

<script>
/* ========== TU HISTORIA (edita solo esta parte) ==========
 Disparadores (on): "start" | "after:SEG" | "code:XXX" | "open:app:wa|hist" | "open:chat:ID" | "leave:chat:ID"
 Condiciones: if:[banderas que deben estar] · not:[banderas que no deben estar]
 Acciones: msg(c,f:"them"|"me",t) · typing(c,ms) · rename(c,n) · lock(c,k) · show(c) · edit(c,i,t) · set(k) · bat(n) · clk(m) · notify(app,title,t) · choices(c,o:[{t,go}]) dispara "go:NOMBRE" · call(c,say) dispara "call:answer|reject|end:ID" · note(id,title,t,k) · photo(id,u,e,t) · mail(id,from,s,t,f) · event(id,d,h,t) · recent(c,k:"in|out|miss") · también "open:mail:ID", "open:event:ID", "dial:NÚMERO" · "open:note:ID" y "open:photo:ID"
 Cada acción puede llevar d = milisegundos de espera tras la anterior. */
const STORY0={
 pin:"1234",
 wall:"",lockWall:"",icons:{},dock:["wa","photos","safari","cam"],
 me:{n:"Mi Teléfono",p:"+52 55 1234 5678",i:"Disponible",img:""},statuses:[],
 contacts:{mama:{p:"555-0101",n:"Mamá",e:"👩"},lu:{p:"555-0202",n:"Lucía",e:"🧑‍🎤"},unk:{n:"Desconocido",e:"❔",hid:1}},
 chats:{
  mama:[["them","¿Ya llegaste a casa?","21:02"],["me","Sí, ya casi","21:04"],["them","Avísame cuando entres","21:05"]],
  lu:[["me","Mañana te cuento todo","20:11"],["them","Dale, pero no se lo digas a nadie","20:12"]],
  unk:[]},
 chapters:[{code:"001",title:"Cap. 1 · La noche del viernes"},{code:"002",title:"Cap. 2 · Número oculto"}],
 recent:[{c:"mama",k:"out",h:"20:40"},{c:"lu",k:"in",h:"19:15"}],
 mails:[{id:"m0",from:"Banco Aurora",s:"Tu estado de cuenta",t:"Tu estado de cuenta de octubre ya está disponible.",h:"08:00"}],
 events:[{id:"e0",d:"2026-11-07",h:"18:00",t:"Cena con Mamá"}],
 notes:[{id:"n0",title:"Lista del súper",t:"Leche, pan, café."}],photos:[{id:"p0",e:"🌅",t:"Playa, verano pasado"}],
 rules:[
  {on:"after:15",do:[{a:"msg",c:"lu",f:"them",t:"¿Sigues despierta?"},{a:"choices",c:"lu",d:500,o:[{t:"Sí, ¿qué pasa?",go:"lu_si"},{t:"Ahora no puedo",go:"lu_no"}]}]},
  {on:"go:lu_si",do:[{a:"msg",c:"lu",f:"them",t:"Te llamo.",d:1500},{a:"call",c:"lu",d:3000,say:"No fue un accidente. Revisa tus fotos."}]},
  {on:"go:lu_no",do:[{a:"msg",c:"lu",f:"them",t:"Está bien. Pero se te acaba el tiempo.",d:1500},{a:"set",k:"ignoro"}]},
  {on:"call:end:lu",do:[{a:"photo",id:"p1",e:"🚪",t:"Puerta del garaje, 23:41",d:800},{a:"note",id:"n1",title:"No olvidar",t:"Llave bajo la maceta. No contestar a Lucía después de las 11.",k:"0807",d:800}]},
  {on:"call:reject:lu",do:[{a:"msg",c:"lu",f:"them",t:"Contesta. Por favor.",d:1500}]},
  {on:"code:001",do:[
   {a:"msg",c:"mama",f:"them",t:"Tu hermano nació el 08/07, ¿te acuerdas?",d:1500},
   {a:"typing",c:"lu",ms:4000,d:3000},
   {a:"set",k:"c1",d:4000}]},
  {on:"open:chat:lu",if:["c1"],do:[
   {a:"typing",c:"lu",ms:2500,d:1000},
   {a:"msg",c:"lu",f:"them",t:"Borra este chat. Ahora.",d:2500},
   {a:"lock",c:"lu",k:"0807",d:3000}]},
  {on:"leave:chat:mama",if:["c1"],do:[
   {a:"edit",c:"mama",i:-1,t:"Tu hermano no existe. No preguntes.",d:800},
   {a:"rename",c:"mama",n:"Mamá ???"},
   {a:"bat",n:23},{a:"clk",m:-137}]},
  {on:"code:002",do:[
   {a:"show",c:"unk",d:500},
   {a:"msg",c:"unk",f:"them",t:"Sé lo que viste.",d:1500},
   {a:"msg",c:"unk",f:"them",t:"No eres la única con acceso a este teléfono.",d:3000}]}
 ]};
let STORY=STORY0;try{const j=JSON.parse(localStorage.getItem("simulia_story"));if(j&&j.contacts&&j.rules)STORY=j}catch(e){}
/* ========== MOTOR ========== */
const KEY="simulia_save_v1",R=STORY.rules,$=id=>document.getElementById(id);
let st,ui={s:"lock",pad:0,pin:"",err:0,chat:null,app:null,msg:"",exp:"",rs:0},typ={},ban=null;
const hm=(o=0)=>new Date(Date.now()+o*6e4).toTimeString().slice(0,5);
const nm=c=>st.names[c]||(STORY.contacts[c]?STORY.contacts[c].n:c);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function fresh(){const ch={},hid={};for(const c in STORY.chats)ch[c]=STORY.chats[c].map(([f,t,h])=>({f,t,h}));
 for(const c in STORY.contacts)if(STORY.contacts[c].hid)hid[c]=1;
 return{t:0,bat:87,drain:1,clk:0,flags:{},done:{},codes:[],chats:ch,names:{},unread:{},hid,locks:{},notifs:[]}}
try{st=JSON.parse(localStorage.getItem(KEY))}catch(e){}
st=st||fresh();st.notes=st.notes||(STORY.notes||[]).map(n=>({...n}));st.photos=st.photos||(STORY.photos||[]).map(p=>({...p}));st.recent=st.recent||(STORY.recent||[]).map(r=>({...r}));st.mails=st.mails||(STORY.mails||[]).map(m=>({r:0,f:"in",...m}));st.events=st.events||(STORY.events||[]).map(e=>({...e}));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
function fire(p){R.forEach((r,i)=>{if(st.done[i]||!p(r))return;
 if((r.if||[]).some(f=>!st.flags[f])||(r.not||[]).some(f=>st.flags[f]))return;
 st.done[i]=1;run(r.do)});save()}
const ev=e=>fire(r=>r.on===e);
function run(l){let t=0;l.forEach(a=>{t+=a.d||0;setTimeout(()=>act(a),t)})}
function notify(app,title,body){st.notifs.unshift({app,title,body,h:hm(st.clk)});st.notifs=st.notifs.slice(0,5);
 ban={title,body};setTimeout(()=>{ban=null;render()},4000)}
function act(a){const c=a.c;switch(a.a){
 case"msg":st.chats[c].push({f:a.f,t:a.t,h:hm(st.clk)});
  if(a.f=="them"&&!(ui.s=="app"&&ui.app=="wa"&&ui.chat==c)){st.unread[c]=(st.unread[c]||0)+1;notify("WhatsApp",nm(c),a.t)}break;
 case"typing":typ[c]=1;setTimeout(()=>{delete typ[c];render()},a.ms);break;
 case"rename":st.names[c]=a.n;break;
 case"lock":st.locks[c]=a.k;ui.pin="";break;
 case"show":delete st.hid[c];break;
 case"edit":{const m=st.chats[c],i=a.i<0?m.length+a.i:a.i;m[i].t=a.t;break}
 case"set":st.flags[a.k]=1;break;
 case"bat":st.bat=a.n;break;
 case"clk":st.clk=a.m;break;
 case"notify":notify(a.app||"Sistema",a.title,a.t);break;
 case"choices":st.ch={c,o:a.o};break;
 case"call":st.call={c,say:a.say||"",on:0};st.recent.unshift({c,k:"miss",h:hm(st.clk)});break;
 case"recent":st.recent.unshift({c,k:a.k||"miss",h:hm(st.clk)});break;
 case"mail":st.mails.unshift({id:a.id,from:a.from,s:a.s,t:a.t,f:a.f||"in",r:0,h:hm(st.clk)});if((a.f||"in")=="in")notify("Correo",a.from,a.s);break;
 case"event":st.events.push({id:a.id,d:a.d,h:a.h||"",t:a.t});break;
 case"note":st.notes.push({id:a.id,title:a.title,t:a.t,k:a.k});break;
 case"photo":st.photos.push({id:a.id,u:a.u,e:a.e||"🖼️",t:a.t});break}
 save();render()}
/* ========== PANTALLAS ========== */
function pad(title){return`<div class="pad"><div class="ti">${title}</div><div class="dots ${ui.err?"sh":""}">${[0,1,2,3].map(i=>`<i class="${i<ui.pin.length?"on":""}"></i>`).join("")}</div><div class="keys">${[1,2,3,4,5,6,7,8,9,"",0,"⌫"].map(k=>k===""?"<b></b>":`<button onclick="G.k('${k}')">${k}</button>`).join("")}</div><button class="lnk" onclick="G.cancel()">Cancelar</button></div>`}
const lock=()=>ui.pad?pad("Introduce el código"):`<div class="lk" onclick="G.pad()"><div class="clk big">${hm(st.clk)}</div><div class="dt">${new Date(Date.now()+st.clk*6e4).toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"})}</div><div class="nl">${st.notifs.map(n=>`<div class="nt"><small>${n.app} · ${n.h}</small><b>${esc(n.title)}</b><span>${esc(n.body)}</span></div>`).join("")}</div><div class="hint">↑<br>Deslizar para desbloquear</div></div>`;
function home(){const u=Object.values(st.unread).reduce((a,b)=>a+b,0);
 return`<div class="hm"><div class="gr"><div class="ap" onclick="G.app('wa')"><span style="background:#25d366">💬</span>WhatsApp${u?`<i class="bd">${u}</i>`:""}</div><div class="ap" onclick="G.app('hist')"><span style="background:linear-gradient(135deg,#7c3aed,#d946ef)">✨</span>Historia</div><div class="ap" onclick="G.app('notes')"><span style="background:#f5c518">📝</span>Notas</div><div class="ap" onclick="G.app('photos')"><span style="background:#fff">🌸</span>Fotos</div><div class="ap" onclick="G.app('phone')"><span style="background:#22c55e">📞</span>Teléfono</div><div class="ap" onclick="G.app('mail')"><span style="background:#3b82f6">✉️</span>Correo</div><div class="ap" onclick="G.app('cal')"><span style="background:#fff">📅</span>Calendario</div></div></div>`}
function wa(){const c=ui.chat;
 if(c){if(st.locks[c])return pad("🔒 "+esc(nm(c)));
  return`<div class="hd"><button onclick="G.back()">‹</button><div><b>${esc(nm(c))}</b><small>${typ[c]?"escribiendo…":""}</small></div></div><div class="msgs">${st.chats[c].map(m=>`<div class="m ${m.f=="me"?"me":"th"}">${esc(m.t)}<small>${m.h}</small></div>`).join("")}${typ[c]?'<div class="m th ty">• • •</div>':""}</div>${st.ch&&st.ch.c==c?`<div class="chs">${st.ch.o.map((o,i)=>`<button onclick="G.pick(${i})">${esc(o.t)}</button>`).join("")}</div>`:""}`}
 const ids=Object.keys(STORY.contacts).filter(k=>!st.hid[k]);
 return`<div class="hd"><b>Chats</b></div><div class="lst">${ids.map(k=>{const l=st.chats[k].slice(-1)[0],u=st.unread[k];
  return`<div class="it" onclick="G.chat('${k}')"><span class="av">${STORY.contacts[k].e}</span><div><b>${esc(nm(k))}</b><small>${st.locks[k]?"🔒 Chat protegido":l?esc(l.t):""}</small></div>${u?`<i class="bd">${u}</i>`:""}</div>`}).join("")}</div>`}
const hist=()=>`<div class="hd"><b>Historia</b></div><div class="hs"><p>Introduce el código de cada capítulo para avanzar.</p><div class="row"><input id="cd" placeholder="Código (ej. 001)" autocomplete="off" onkeydown="if(event.key=='Enter')G.code()"><button onclick="G.code()">Entrar</button></div><p class="ms">${esc(ui.msg)}</p>${STORY.chapters.filter(c=>st.codes.includes(c.code)).map(c=>`<div class="ch">✓ ${esc(c.title)}</div>`).join("")}<h4>Partida</h4><p class="sm">Se guarda sola en este dispositivo. Para pasarla a otro, exporta el código y pégalo allí.</p><div class="row"><button onclick="G.exp()">Exportar</button><button onclick="G.imp()">Importar</button><button onclick="G.rst()">Reiniciar</button></div><textarea id="ta" rows="4" placeholder="Código de partida">${esc(ui.exp)}</textarea></div>`;

function home(){const u=Object.values(st.unread).reduce((a,b)=>a+b,0),I=STORY.icons||{};

function wa(){const c=ui.chat,t=ui.wt||"chats",M=STORY.me||{};
 if(c){if(st.locks[c])return`<div class="wa">${pad("🔒 "+esc(nm(c)))}</div>`;
  return`<div class="wa"><div class="hd"><button onclick="G.back()">←</button>${av(c,"width:38px;height:38px")}<div><b>${esc(nm(c))}</b><small>${typ[c]?"escribiendo…":"en línea"}</small></div><span style="margin-left:auto">📞</span></div><div class="msgs">${st.chats[c].map(m=>`<div class="m ${m.f=="me"?"me":"th"}">${esc(m.t)}<small>${m.h}${m.f=="me"?" ✓✓":""}</small></div>`).join("")}${typ[c]?'<div class="m th ty">• • •</div>':""}</div>${st.ch&&st.ch.c==c?`<div class="chs">${st.ch.o.map((o,i)=>`<button onclick="G.pick(${i})">${esc(o.t)}</button>`).join("")}</div>`:""}<div class="inp"><span class="cm">📷</span><div class="tx">Mensaje</div><span class="mic">🎙️</span></div></div>`}
 let b;
 if(t=="chats")b=`<div class="sr">🔍 Buscar…</div>`+Object.keys(STORY.contacts).filter(k=>!st.hid[k]&&st.chats[k]).map(k=>{const l=st.chats[k].slice(-1)[0],u=st.unread[k];return`<div class="it" onclick="G.chat('${k}')">${av(k)}<div><b>${esc(nm(k))}</b><small>${st.locks[k]?"🔒 Chat protegido":l?esc(l.t):""}</small></div><span class="rt"><small>${l?l.h:""}</small>${u?`<i class="bd">${u}</i>`:""}</span></div>`}).join("");
 else if(t=="calls")b=`<div class="sec">LLAMADAS RECIENTES</div>`+(st.recent.map(r=>`<div class="it">${av(r.c)}<div><b style="${r.k=="miss"?"color:#ef4444":""}">${esc(nm(r.c))}</b><small>${{in:"↙ Entrante",out:"↗ Saliente",miss:"↙ Perdida"}[r.k]}</small></div><small>${r.h}</small></div>`).join("")||none("Sin llamadas"));
 else if(t=="status")b=`<div class="sec">MI ESTADO</div><div class="it"><span class="av">${M.img?`<img src="${esc(M.img)}" alt="">`:"🙂"}</span><div><b>Mi estado</b><small>Sin actualizaciones</small></div></div><div class="sec">ACTUALIZACIONES RECIENTES</div>`+(STORY.statuses||[]).map(s=>`<div class="it">${av(s.c)}<div><b>${esc(nm(s.c))}</b><small>${esc(s.t)}</small></div></div>`).join("");
 else b=`<div class="me0"><span class="av big0">${M.img?`<img src="${esc(M.img)}" alt="">`:"🙂"}</span><b>${esc(M.n||"")}</b><small>${esc(M.i||"")}</small></div><div class="fl"><small>NÚMERO DE TELÉFONO</small>${esc(M.p||"")}</div><div class="fl"><small>NOMBRE</small>${esc(M.n||"")}</div><div class="fl"><small>INFO</small>${esc(M.i||"")}</div><div class="fl">🚫 Contactos bloqueados</div><div class="fl">🔔 Notificaciones</div>`;
 return`<div class="wa"><div class="hd"><button onclick="G.home()">←</button><b style="flex:1;text-align:center">${{chats:"Chats",calls:"Llamadas",status:"Estados",set:"Ajustes"}[t]}</b><span>⋮</span></div><div class="lst">${b}</div><div class="tab">${[["chats","💬","Chats"],["calls","📞","Llamadas"],["status","⭕","Estados"],["set","⚙️","Ajustes"]].map(([k,i,l])=>`<button class="${t==k?"on":""}" onclick="G.wt('${k}')"><b>${i}</b>${l}</button>`).join("")}</div></div>`}
function render(){
 const c0=$("cd"),v=c0&&c0.value,f=c0&&document.activeElement==c0;
 const h=ui.s=="lock"?lock():ui.s=="home"?home():ui.app=="wa"?wa():ui.app=="notes"?notes():ui.app=="photos"?photos():ui.app=="phone"?phone():ui.app=="mail"?mail():ui.app=="cal"?cal():hist();
 const b=ban&&ui.s!="lock"?`<div class="ban"><b>${esc(ban.title)}</b><span>${esc(ban.body)}</span></div>`:"";
 $("scr").innerHTML=`<div class="nch"></div><div class="sb"><span class="clk">${hm(st.clk)}</span><span class="bt">●●●● WiFi ${st.bat}%</span></div>${h}${b}${st.call?callUI():""}<div class="hb" onclick="G.home()"></div>`;
 $("scr").dataset.m=ui.s=="app"?ui.app:ui.s;const w=ui.s=="lock"?STORY.lockWall:STORY.wall;$("scr").style.background=w?`center/cover url("${w}")`:"";
 const c1=$("cd");if(c1&&v!=null){c1.value=v;if(f)c1.focus()}
 const m=document.querySelector(".msgs");if(m)m.scrollTop=1e9}
const leave=()=>{if(ui.s=="app"&&ui.app=="wa"&&ui.chat&&!st.locks[ui.chat])ev("leave:chat:"+ui.chat)};
const G={
 pad(){ui.pad=1;ui.pin="";render()},

 k(d){if(d=="⌫")ui.pin=ui.pin.slice(0,-1);else if(ui.pin.length<4)ui.pin+=d;
  if(ui.pin.length==4){const lk=ui.s=="lock",nt=ui.app=="notes"&&ui.nt!=null,want=lk?STORY.pin:nt?st.notes[ui.nt].k:st.locks[ui.chat];
   if(ui.pin==want){ui.pin="";

    else if(nt){const n=st.notes[ui.nt];delete n.k;ev("open:note:"+n.id)}

   else{ui.err=1;render();setTimeout(()=>{ui.err=0;ui.pin="";render()},450);return}}
  render();save()},
 app(a){if(!OK.includes(a)){ban={title:"Próximamente",body:"Esta app aún no está disponible."};setTimeout(()=>{ban=null;render()},2500);render();return}ui.s="app";ui.app=a;ui.chat=null;ui.nt=ui.ph=ui.ml=null;ev("open:app:"+a);render()},
 home(){if(ui.s=="lock")return;leave();ui.s="home";ui.app=null;ui.chat=null;ui.nt=ui.ph=ui.ml=null;render()},

 exp(){ui.exp=btoa(unescape(encodeURIComponent(JSON.stringify(st))));ui.msg="Copia el código de abajo.";render();$("ta").select()},

  try{localStorage.removeItem(KEY)}catch(e){}location.reload()}
